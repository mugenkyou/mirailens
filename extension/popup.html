<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiraiLens Console</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="console-panel">
      <!-- Header -->
      <div class="console-header">
        <div class="brand">
          <img src="icons/favicon-32x32.png" alt="Icon" class="brand-icon" />
          <span class="brand-name">MiraiLens</span>
        </div>
        <div class="header-controls">
          <div id="status-badge" class="connection-status">
            <span class="status-dot"></span>
            <span id="status-text" class="mono">DISCONNECTED</span>
          </div>
          <button id="btn-history" class="btn-icon" aria-label="History" title="History">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="7"></circle>
              <polyline points="8 3 8 8 11 8"></polyline>
            </svg>
          </button>
          <button id="btn-settings" class="btn-icon" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="1.5"></circle>
              <path d="M12.5 8c0-.3-.2-.5-.4-.7-.4-.3-.6-.8-.5-1.3.1-.4-.1-.9-.5-1.1-.3-.2-.7-.2-1-.1-.5.2-1 .1-1.3-.2-.3-.3-.4-.8-.2-1.3.2-.4.1-.9-.2-1.2s-.8-.4-1.2-.2c-.5.2-1 .1-1.3-.2-.3-.3-.3-.8-.1-1.3-.1-.4-.5-.7-.9-.8H6.9c-.4.1-.8.4-.9.8.2.5.1 1-.2 1.3-.3.3-.8.4-1.3.2-.4-.2-.9-.1-1.2.2s-.3.8-.1 1.2c.2.5.1 1-.2 1.3-.3.3-.8.4-1.3.2H1.9c-.4.2-.6.7-.5 1.1.1.5-.1 1-.5 1.3-.2.2-.2.6-.1.9.3.3.8.4 1.3.2.5-.2 1-.1 1.3.2.3.3.4.8.2 1.3-.2.4-.1.9.2 1.2.3.2.7.2 1 .1.5-.2 1-.1 1.3.2.3.3.3.8.1 1.3.1.4.5.7.9.8h.2c.4-.1.8-.4.9-.8-.2-.5-.1-1 .2-1.3.3-.3.8-.4 1.3-.2.4.2.9.1 1.2-.2.3-.3.3-.8.1-1.2-.2-.5-.1-1 .2-1.3.3-.3.8-.4 1.3-.2.4.2.8 0 .9-.4V8.5c-.1-.2 0-.4.1-.5z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Control Panel -->
      <div id="control-panel" class="hidden">
        <div class="divider"></div>

        <div class="section-title">CONTROL</div>
        <div class="control-state-box">
          <div id="ai-status-badge" class="status-indicator">
            <span class="status-indicator-dot"></span>
            <span id="ai-status-text" class="mono">-</span>
          </div>
          <div id="control-state-desc" class="desc-text">AI is idle.</div>
        </div>

        <div class="divider"></div>

        <div class="section-title">CURRENT TAB</div>
        <div class="tab-box">
          <div id="controlled-url" class="mono truncate">No active tab</div>
        </div>

        <div class="divider"></div>

        <div class="section-title">SESSION TELEMETRY</div>
        <div class="telemetry-table">
          <div class="telemetry-row">
            <span class="telemetry-label">CONNECTED TAB</span>
            <span id="telemetry-tab-id" class="telemetry-value mono">-</span>
          </div>
          <div class="telemetry-row">
            <span class="telemetry-label">SERVER URL</span>
            <span id="telemetry-server-url" class="telemetry-value mono">-</span>
          </div>
          <div class="telemetry-row">
            <span class="telemetry-label">ENGINE PROTOCOL</span>
            <span class="telemetry-value mono">WS / JSON-RPC</span>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Action Grid -->
        <div class="control-actions">
          <button id="btn-take-control" class="btn btn-primary">TAKE CONTROL</button>
          <button id="btn-return-control" class="btn btn-primary hidden">RETURN TO AI</button>

          <button id="btn-pause" class="btn btn-secondary">PAUSE AI</button>
          <button id="btn-resume" class="btn btn-secondary hidden">RESUME AI</button>
        </div>

        <button id="btn-stop" class="btn btn-danger">EMERGENCY STOP</button>
        <button id="btn-reset" class="btn btn-secondary hidden">RESET EMERGENCY STOP</button>
      </div>

      <!-- Connection Actions (when offline) -->
      <div id="connection-prompt" class="connection-actions">
        <button id="connect" class="btn btn-primary">CONNECT TO MCP SERVER</button>
      </div>

      <div class="connection-actions">
        <button id="connect-tab" class="btn btn-secondary hidden">CONNECT FROM THIS TAB</button>
        <button id="focus-tab" class="btn btn-secondary hidden">FOCUS CONNECTED TAB</button>
        <button id="disconnect" class="btn btn-secondary hidden">DISCONNECT</button>
      </div>

      <div id="last-error" class="error-box hidden"></div>

      <div class="divider"></div>

      <div class="section-title audit-header">
        <span>AUDIT TRAIL</span>
        <button id="btn-clear-audit" class="btn-small">CLEAR</button>
      </div>
      <div id="audit-log-container" class="audit-log-box">
        <div class="audit-empty">No audit records</div>
      </div>

      <div class="footer mono">v1.2.2</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

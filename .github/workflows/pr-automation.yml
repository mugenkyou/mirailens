name: PR Automation

on:
  pull_request_target:
    types: [opened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-automation:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # OPENED PR
      # ------------------------------------------------------------
      - name: Process opened pull request
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const author = pr.user.login;
            const body = pr.body || '';

            // --------------------------------------------------------
            // Extract linked issues
            // Supports:
            // #123
            // fixes #123
            // closes #123
            // resolves #123
            // --------------------------------------------------------

            const issuePattern =
              /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*#(\d+)|#(\d+)/gi;

            const matches = [...body.matchAll(issuePattern)];

            const issueNumbers = [
              ...new Set(
                matches
                  .map(match => match[3] || match[4])
                  .filter(Boolean)
              )
            ];

            // --------------------------------------------------------
            // Labels
            // --------------------------------------------------------

            const labels = new Set(['awaiting review']);
            const linkedIssues = [];

            for (const issueNumber of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(issueNumber)
                });

                linkedIssues.push({
                  number: issueNumber,
                  title: issue.data.title
                });

                for (const label of issue.data.labels) {
                  const name =
                    typeof label === 'string'
                      ? label
                      : label.name;

                  if (name) labels.add(name);
                }
              } catch (error) {
                console.log(
                  `Unable to inspect issue #${issueNumber}: ${error.message}`
                );
              }
            }

            // Apply labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [...labels]
            });

            // --------------------------------------------------------
            // Assign project maintainer for review
            // --------------------------------------------------------

            if (author !== 'mugenkyou') {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: ['mugenkyou']
                });
              } catch (error) {
                console.log(
                  `Unable to request reviewer: ${error.message}`
                );
              }
            }

            // --------------------------------------------------------
            // Professional acknowledgement
            // --------------------------------------------------------

            let comment = `## Pull Request Received

Thank you for contributing to **MiraiLens**.

Your pull request has been received and will be reviewed against the
project's engineering, security, and contribution requirements.

`;

            if (linkedIssues.length > 0) {
              comment += `### Linked Issues

`;

              for (const issue of linkedIssues) {
                comment += `- #${issue.number} — ${issue.title}\n`;
              }

              comment += `\n`;
            }

            comment += `### Review Checklist

Before review, please ensure:

- [ ] The change is scoped to the purpose of this pull request
- [ ] Relevant tests have been added or updated
- [ ] Existing functionality has been verified
- [ ] No security or policy guarantees have been weakened
- [ ] Documentation has been updated where necessary
- [ ] The changes follow the repository contribution guidelines

`;

            if (author !== 'mugenkyou') {
              comment += `A project maintainer has been requested for review.

`;
            }

            comment += `> Automated acknowledgement — maintainers will review the implementation, tests, and security implications before merging.

Thank you for helping improve MiraiLens.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

      # ------------------------------------------------------------
      # MERGED PR
      # ------------------------------------------------------------

      - name: Acknowledge merged pull request
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const contributor = pr.user.login;

            const comment = `## Pull Request Merged

Thank you, @${contributor}.

This pull request has been successfully merged into **main** and is now
part of MiraiLens.

Your contribution is now part of the project's development history.

Thank you for contributing to MiraiLens.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

      # ------------------------------------------------------------
      # UPDATE LABELS AFTER CLOSE
      # ------------------------------------------------------------
 
      - name: Update labels after close
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'awaiting review'
              });
            } catch (error) {
              console.log(
                'awaiting review label was already removed or does not exist.'
              );
            }